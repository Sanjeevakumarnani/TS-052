services:
  - type: web
    name: infrapulse-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: CORS_ORIGINS
        # Replace with your actual Vercel frontend URL after deploy
        value: https://infrapulse.vercel.app,http://localhost:5173
      - key: DATABASE_URL
        # Set this in Render dashboard: copy the Neon connection string
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_USERNAME
        value: admin
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
